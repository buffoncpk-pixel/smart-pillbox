<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPill 智慧藍牙藥盒</title>
<style>
  :root {
    --primary: #16c783;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --card-bg: #ffffff;
    --text: #1f2937;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft JhengHei", sans-serif;
    background: #f8fafc;
    color: var(--text);
    margin: 0;
    padding: 16px;
  }
  .container { max-width: 680px; margin: 0 auto; }
  .header {
    background: linear-gradient(135deg, #0e8a5b, #16c783);
    color: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(22, 199, 131, 0.28);
    margin-bottom: 20px;
  }
  .header h1 { margin: 0 0 10px 0; font-size: 24px; display: flex; align-items: center; gap: 8px; }
  .clock-box { font-size: 14px; opacity: 0.95; line-height: 1.6; }
  .clock-time { font-size: 28px; font-weight: bold; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  
  .ble-bar {
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ble-status { font-weight: bold; font-size: 14px; }
  .ble-btn {
    background: #10b981;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .ble-btn:hover { background: #0e8a5b; }

  .grid-days { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 20px; }
  @media(min-width: 600px) { .grid-days { grid-template-columns: 1fr 1fr; } }
  
  .day-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    transition: opacity 0.3s;
  }
  .day-card.disabled {
    opacity: 0.45;
  }
  .day-title {
    font-weight: 700;
    color: #334155;
    margin-bottom: 12px;
    border-bottom: 2px solid #f1f5f9;
    padding-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .day-check-label {
    font-size: 13px;
    font-weight: normal;
    color: #64748b;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .slot-item {
    background: #f8fafc;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    border-left: 4px solid #cbd5e1;
    transition: all 0.3s;
  }
  .slot-item.taken { border-left-color: var(--success); background: #f0fdf4; }
  .slot-item.alert { border-left-color: var(--warning); background: #fffbeb; }
  .slot-item.overdue { border-left-color: var(--danger); background: #fef2f2; animation: pulse 1.5s infinite; }
  .slot-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; }
  .badge-taken { background: #dcfce7; color: #166534; }
  .badge-pending { background: #f1f5f9; color: #475569; }
  .badge-alert { background: #fef3c7; color: #92400e; }
  .badge-overdue { background: #fee2e2; color: #991b1b; }
  .badge-disabled { background: #e2e8f0; color: #94a3b8; }
  .input-row { display: flex; gap: 6px; }
  input[type="date"], input[type="time"], input[type="number"] {
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    background: white;
  }
  .config-card {
    background: var(--card-bg);
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    margin-bottom: 20px;
  }
  .btn-submit {
    width: 100%;
    background: var(--primary);
    color: white;
    font-size: 16px;
    font-weight: 600;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(22, 199, 131, 0.25);
  }
  .btn-submit:hover { background: #13aa6f; }
  .btn-reset {
    width: 100%;
    background: #64748b;
    color: white;
    font-size: 14px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
  }
  .hint-text { font-size: 12px; color: #64748b; margin-top: 4px; }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.01); box-shadow: 0 0 10px rgba(239,68,68,0.3); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>💊 SmartPill 智慧聯網藥盒</h1>
    <div class="clock-box">
      <span id="curDate">--年--月--日</span> (<span id="curWeek">--</span>)<br>
      <div class="clock-time" id="curTime">--:--:--</div>
    </div>
  </div>

  <div class="ble-bar">
    <div>
      <div style="font-size: 12px; color: #64748b;">裝置連線狀態</div>
      <div id="bleStatusText" class="ble-status" style="color: #ef4444;">🔴 尚未連線藥盒</div>
    </div>
    <button type="button" class="ble-btn" id="btnConnect" onclick="toggleConnect()">🔍 搜尋並連接藥盒</button>
  </div>

  <div class="config-card">
    <label style="font-weight: 600; font-size: 14px;">⏱️ 超時未服提醒：</label>
    <span style="font-size: 13px; color: #64748b;">時間到達後超過</span>
    <input type="number" id="tolerance" min="1" max="60" value="1" style="width: 60px;">
    <span style="font-size: 13px; color: #64748b;">分鐘未服，將啟動警報</span>
    <div class="hint-text">💡 提示：可勾選/取消勾選指定天數；更改「第 1 天」日期時，系統會自動順延後續天數！</div>
  </div>

  <div class="grid-days" id="daysContainer"></div>

  <button type="button" class="btn-submit" onclick="sendScheduleToESP32()">💾 傳送並儲存排程至藥盒</button>
  <button type="button" class="btn-reset" onclick="sendResetToESP32()">🔄 重設全部日程時間與服藥狀態（新週期）</button>
</div>

<script>
const SERVICE_UUID           = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_UUID_RX = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
const CHARACTERISTIC_UUID_TX = "beb5483e-36e1-4688-b7f5-ea07361b26a9";

let bleDevice = null;
let rxCharacteristic = null;
let txCharacteristic = null;

function updateLocalClock() {
  const now = new Date();
  const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const mi = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');

  document.getElementById('curDate').innerText = `${yyyy}年${mm}月${dd}日`;
  document.getElementById('curWeek').innerText = weekDays[now.getDay()];
  document.getElementById('curTime').innerText = `${hh}:${mi}:${ss}`;
}
setInterval(updateLocalClock, 1000);
updateLocalClock();

function addDays(dateStr, days) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
  d.setDate(d.getDate() + days);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function onDay1DateChanged() {
  const baseDate = document.getElementById('d0').value;
  if (!baseDate) return;
  document.getElementById('d1').value = baseDate;
  document.getElementById('d2').value = addDays(baseDate, 1);
  document.getElementById('d3').value = addDays(baseDate, 1);
  document.getElementById('d4').value = addDays(baseDate, 2);
  document.getElementById('d5').value = addDays(baseDate, 2);
  document.getElementById('d6').value = addDays(baseDate, 3);
  document.getElementById('d7').value = addDays(baseDate, 3);
}

function toggleDayEnable(day) {
  const chk = document.getElementById(`day-chk-${day}`);
  const card = document.getElementById(`day-card-${day}`);
  const inputs = card.querySelectorAll('input[type="date"], input[type="time"]');

  if (chk.checked) {
    card.classList.remove('disabled');
    inputs.forEach(i => i.disabled = false);
  } else {
    card.classList.add('disabled');
    inputs.forEach(i => i.disabled = true);
  }
}

// 建立 4 天介面
function initUI(preserveValues = false) {
  const container = document.getElementById('daysContainer');
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const todayStr = `${yyyy}-${mm}-${dd}`;

  container.innerHTML = '';

  for (let d = 0; d < 4; d++) {
    let card = document.createElement('div');
    card.id = `day-card-${d}`;
    card.className = 'day-card';
    card.innerHTML = `
      <div class="day-title">
        <span>第 ${d+1} 天日程</span>
        <label class="day-check-label">
          <input type="checkbox" id="day-chk-${d}" checked onchange="toggleDayEnable(${d})"> 啟用此日
        </label>
      </div>
    `;
    
    for (let t = 0; t < 2; t++) {
      let idx = d * 2 + t;
      let targetDate = addDays(todayStr, d);
      let targetTime = (t === 0) ? "08:00" : "20:00";

      let item = document.createElement('div');
      item.id = `slot-box-${idx}`;
      item.className = 'slot-item';
      // 已移除 LED 標記，純粹顯示「第 1 次」或「第 2 次」
      item.innerHTML = `
        <div class="slot-header">
          <span>第 ${t+1} 次</span>
          <span id="badge-${idx}" class="badge badge-pending">排程等待中</span>
        </div>
        <div class="input-row">
          <input type="date" id="d${idx}" value="${targetDate}" required>
          <input type="time" id="t${idx}" value="${targetTime}" required>
        </div>
      `;
      card.appendChild(item);
    }
    container.appendChild(card);
  }

  document.getElementById('d0').addEventListener('change', onDay1DateChanged);
}
initUI();

async function toggleConnect() {
  if (bleDevice && bleDevice.gatt.connected) {
    bleDevice.gatt.disconnect();
    return;
  }

  try {
    document.getElementById('bleStatusText').innerText = "連線中...";
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'SmartPillBox' }],
      optionalServices: [SERVICE_UUID]
    });

    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
    txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

    await txCharacteristic.startNotifications();
    txCharacteristic.addEventListener('characteristicvaluechanged', onNotifyReceived);

    document.getElementById('bleStatusText').innerText = "🟢 已成功連線至藥盒";
    document.getElementById('bleStatusText').style.color = "#10b981";
    document.getElementById('btnConnect').innerText = "斷開連線";

    // 連線後同步時間並觸發 ESP32 回傳已儲存設定
    syncPhoneTimeToESP32();

  } catch (error) {
    console.error("藍牙連線錯誤:", error);
    onDisconnected();
  }
}

function onDisconnected() {
  document.getElementById('bleStatusText').innerText = "🔴 尚未連線藥盒";
  document.getElementById('bleStatusText').style.color = "#ef4444";
  document.getElementById('btnConnect').innerText = "🔍 搜尋並連接藥盒";
  rxCharacteristic = null;
  txCharacteristic = null;
}

// 接收 ESP32 封包
function onNotifyReceived(event) {
  const text = new TextDecoder().decode(event.target.value);

  // 1. 回讀排程設定: CFG:tolerance|idx,en,YYYY-MM-DD,HH:MM
  if (text.startsWith("CFG:")) {
    const parts = text.substring(4).split('|');
    const tol = parts[0];
    const s = parts[1].split(',');
    const idx = parseInt(s[0], 10);
    const en = (s[1] === "1");
    const dVal = s[2];
    const tVal = s[3];

    document.getElementById('tolerance').value = tol;
    
    const dInput = document.getElementById(`d${idx}`);
    const tInput = document.getElementById(`t${idx}`);
    if (dInput && tInput) {
      dInput.value = dVal;
      tInput.value = tVal;
    }

    // 更新第幾天的 checkbox 狀態
    const day = Math.floor(idx / 2);
    const chk = document.getElementById(`day-chk-${day}`);
    if (chk) {
      chk.checked = en;
      toggleDayEnable(day);
    }
  }
  // 2. 即時狀態碼更新: S:0,1,2,3,4,0,0,0
  else if (text.startsWith("S:")) {
    const states = text.substring(2).split(',');
    states.forEach((st, idx) => {
      const box = document.getElementById(`slot-box-${idx}`);
      const badge = document.getElementById(`badge-${idx}`);
      if (!box || !badge) return;

      box.className = 'slot-item';
      if (st === "4") {
        badge.className = 'badge badge-disabled';
        badge.innerText = '未啟用';
      } else if (st === "3") {
        box.classList.add('taken');
        badge.className = 'badge badge-taken';
        badge.innerText = '已服藥 ✓';
      } else if (st === "2") {
        box.classList.add('overdue');
        badge.className = 'badge badge-overdue';
        badge.innerText = '⚠️ 逾時未服藥！';
      } else if (st === "1") {
        box.classList.add('alert');
        badge.className = 'badge badge-alert';
        badge.innerText = '服藥提醒中...';
      } else {
        badge.className = 'badge badge-pending';
        badge.innerText = '排程等待中';
      }
    });
  }
}

async function syncPhoneTimeToESP32() {
  if (!rxCharacteristic) return;
  const now = new Date();
  const timeMsg = `T:${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}-${now.getHours()}-${now.getMinutes()}-${now.getSeconds()}`;
  await rxCharacteristic.writeValue(new TextEncoder().encode(timeMsg));
}

// 傳送排程與啟用天數
async function sendScheduleToESP32() {
  if (!rxCharacteristic) {
    alert("請先點擊上方按鈕連接藥盒！");
    return;
  }

  await syncPhoneTimeToESP32();

  const tol = parseInt(document.getElementById('tolerance').value, 10);
  let payload = `SET:${tol}`;

  for (intDay = 0; intDay < 4; intDay++) {
    const isEn = document.getElementById(`day-chk-${intDay}`).checked ? 1 : 0;
    for (intT = 0; intT < 2; intT++) {
      let i = intDay * 2 + intT;
      const dVal = document.getElementById(`d${i}`).value;
      const tVal = document.getElementById(`t${i}`).value;
      payload += `|${i},${isEn},${dVal},${tVal}`;
    }
  }

  await rxCharacteristic.writeValue(new TextEncoder().encode(payload));
  alert("排程與啟用天數已成功寫入藥盒！");
}

// 重設新週期
async function sendResetToESP32() {
  if (!rxCharacteristic) {
    alert("請先點擊上方按鈕連接藥盒！");
    return;
  }
  if (!confirm("確定要重設為今日起算的新週期，並重置所有服藥紀錄與時間嗎？")) return;

  await rxCharacteristic.writeValue(new TextEncoder().encode("RESET"));
  initUI();
}
</script>
</body>
</html>
